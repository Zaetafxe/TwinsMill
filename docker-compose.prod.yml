services:
  mongodb:
    image: mongo:7
    container_name: smart-milling-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-smartmill}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
    volumes:
      - mongodb_data:/data/db
    networks:
      - twinsmill-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: smart-milling-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-smartmill}:${MONGO_ROOT_PASSWORD:-change-me}@mongodb:27017/smart_milling?authSource=admin
    expose:
      - "8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - twinsmill-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
    container_name: smart-milling-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - twinsmill-net

  nginx:
    image: nginx:1.27-alpine
    container_name: smart-milling-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/www:/var/www/certbot:ro
    networks:
      - twinsmill-net

volumes:
  mongodb_data:

networks:
  twinsmill-net:
    driver: bridge
